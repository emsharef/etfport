name: Package and research checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      lean:
        description: Build the pinned Lean proof project (large dependency download)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,research]"
      - run: pytest
      - run: python scripts/check_package.py
      - run: python -m build
      - run: etfport solve examples/custom_problem.json --horizon compare --output build/custom.json
  lean:
    if: github.event_name == 'workflow_dispatch' && inputs.lean
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean toolchain manager
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: lean/.lake
          key: lean-${{ runner.os }}-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lean-${{ runner.os }}-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}-
      - run: lake exe cache get
        working-directory: lean
      - run: lake build Audit
        working-directory: lean
